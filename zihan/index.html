  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="zi-han-hui-yuan-app"
    >
      <!-- Static boot screen, pure HTML/CSS with no JS dependency. Until now
           the root div was empty until the whole JS bundle had downloaded
           and run, so on a slow or proxied connection the app was a blank
           page indefinitely — the recurring "打不开" report. This paints
           immediately; React replaces it the moment the app mounts. If the
           app still hasn't mounted after 10s, the watchdog script below
           swaps in a cache-busting retry button (an iOS home-screen web
           app can hold a cached copy of an older build whose hashed assets
           no longer exist — a plain reload can loop on that stale page,
           the ?r= reload forces a fresh one). -->
      <div
        id="boot-splash"
        style="min-height: 100vh; background: #fbf7ee; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;"
      >
        <div style="font-family: 'Songti SC', 'Noto Serif SC', serif; font-size: 44px; letter-spacing: 0.08em; color: #7d6eab;">紫涵</div>
        <div style="font-size: 16px; font-weight: 700; color: #4a4258;">紫涵专业美发会所</div>
        <p id="boot-msg" style="margin: 6px 0 0; font-size: 14px; color: #8d84a3;">正在打开，请稍等…</p>
        <button
          id="boot-retry"
          type="button"
          style="display: none; margin-top: 10px; border: none; border-radius: 12px; background: #7d6eab; color: #fff; font-size: 16px; font-weight: 700; padding: 12px 32px; min-height: 44px;"
          onclick="var u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString());"
        >
          重新打开
        </button>
      </div>
    </div>
    <script>
/* =============================================================================
   紫涵会员 App · 纯本地数据引擎
   -----------------------------------------------------------------------------
   原版 App 通过 @hatch/space-sdk 的 action client POST ./actions 到服务器。
   这里用一个完全等价的前端实现顶替那次网络请求：拦截 fetch('…/actions')，
   在同一页面内用 localStorage 完成全部读写，返回与 actions.ts 完全相同的数据结构。
   App 的界面、路由、权限、审批流、报表逻辑一行未改。
   ========================================================================== */
(function () {
  'use strict';

  var STORE_KEY = 'zihan_salon_local_v1';
  var APPROVAL_THRESHOLD_CENTS = 50000; // 500 元：店员大额充值需老板审批
  var DEFAULT_PACKAGES = [[10000, 10000], [20000, 22000], [50000, 58000], [100000, 120000]];

  /* ------------------------------------------------------------------ 存储 */

  var storageOK = true;
  try {
    var probeKey = '__zihan_probe__';
    window.localStorage.setItem(probeKey, '1');
    window.localStorage.removeItem(probeKey);
  } catch (e) {
    storageOK = false;
  }

  var memoryStore = null; // localStorage 不可用时的兜底（关页面即丢）

  function readRaw() {
    if (!storageOK) return memoryStore;
    try { return window.localStorage.getItem(STORE_KEY); } catch (e) { storageOK = false; return memoryStore; }
  }
  function writeRaw(text) {
    memoryStore = text;
    if (!storageOK) return false;
    try { window.localStorage.setItem(STORE_KEY, text); return true; } catch (e) { storageOK = false; return false; }
  }

  var db = null;

  function iso(d) { return (d instanceof Date ? d : new Date(d)).toISOString(); }
  function nowISO() { return new Date().toISOString(); }
  function ms(v) { return new Date(v).getTime(); }

  function emptyDB() {
    return {
      v: 1,
      seeded: false,
      members: [],
      transactions: [],
      staff: [],
      pending: [],
      settings: {},
      seq: { member: 0, txn: 0, staff: 0, pending: 0 }
    };
  }

  function nextId(kind) {
    db.seq[kind] = (db.seq[kind] || 0) + 1;
    return db.seq[kind];
  }

  function normalize(raw) {
    var d = emptyDB();
    if (!raw || typeof raw !== 'object') return d;
    d.seeded = !!raw.seeded;
    d.settings = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    d.seq = Object.assign(d.seq, raw.seq || {});
    (Array.isArray(raw.members) ? raw.members : []).forEach(function (m) {
      if (!m || !m.phone) return;
      d.members.push({
        id: Number(m.id) || 0,
        memberNo: String(m.memberNo || ''),
        name: String(m.name || ''),
        phone: String(m.phone),
        pin: String(m.pin || ''),
        balanceCents: Math.round(Number(m.balanceCents) || 0),
        note: String(m.note || ''),
        createdAt: m.createdAt || nowISO(),
        lastVisitAt: m.lastVisitAt || null
      });
    });
    (Array.isArray(raw.transactions) ? raw.transactions : []).forEach(function (t) {
      if (!t) return;
      d.transactions.push({
        id: Number(t.id) || 0,
        memberId: Number(t.memberId) || 0,
        type: t.type === 'recharge' || t.type === 'adjust' || t.type === 'walkin' ? t.type : 'consume',
        paidCents: t.paidCents === null || t.paidCents === undefined ? null : Math.round(Number(t.paidCents) || 0),
        payMethod: t.payMethod === 'wechat' || t.payMethod === 'cash' || t.payMethod === 'alipay' ? t.payMethod : null,
        amountCents: Math.round(Number(t.amountCents) || 0),
        balanceBeforeCents: Math.round(Number(t.balanceBeforeCents) || 0),
        balanceAfterCents: Math.round(Number(t.balanceAfterCents) || 0),
        operator: String(t.operator || ''),
        operatorRole: t.operatorRole === 'boss' ? 'boss' : 'staff',
        item: String(t.item || ''),
        reason: String(t.reason || ''),
        createdAt: t.createdAt || nowISO()
      });
    });
    (Array.isArray(raw.staff) ? raw.staff : []).forEach(function (s) {
      if (!s || !s.pin) return;
      d.staff.push({
        id: Number(s.id) || 0,
        name: String(s.name || '店员'),
        pin: String(s.pin),
        createdAt: s.createdAt || nowISO()
      });
    });
    (Array.isArray(raw.pending) ? raw.pending : []).forEach(function (p) {
      if (!p) return;
      d.pending.push({
        id: Number(p.id) || 0,
        memberId: Number(p.memberId) || 0,
        paidCents: Math.round(Number(p.paidCents) || 0),
        creditCents: Math.round(Number(p.creditCents) || 0),
        payMethod: p.payMethod === 'cash' || p.payMethod === 'alipay' ? p.payMethod : 'wechat',
        isCustom: !!p.isCustom,
        operator: String(p.operator || ''),
        status: p.status === 'approved' || p.status === 'rejected' ? p.status : 'pending',
        createdAt: p.createdAt || nowISO(),
        decidedBy: p.decidedBy || null,
        decidedAt: p.decidedAt || null
      });
    });
    // 修复缺失的自增序号
    ['members', 'transactions', 'staff', 'pending'].forEach(function (k) {
      var kind = { members: 'member', transactions: 'txn', staff: 'staff', pending: 'pending' }[k];
      d[k].forEach(function (row) { if (row.id > (d.seq[kind] || 0)) d.seq[kind] = row.id; });
    });
    return d;
  }

  /* ------------------------------------------------------------------ 种子 */

  function seedExamples(target) {
    var d = target || db;
    var existing = d.members.length;
    if (existing > 0) return { seeded: false, memberCount: existing };

    if (d.staff.length === 0) {
      d.staff.push({ id: nextId('staff'), name: '小芳', pin: '1111', createdAt: nowISO() });
      d.staff.push({ id: nextId('staff'), name: '小丽', pin: '2222', createdAt: nowISO() });
    }

    var DAY = 86400000;
    function at(daysAgo, hour) {
      var x = new Date(Date.now() - daysAgo * DAY);
      x.setHours(hour, 15, 0, 0);
      if (x.getTime() > Date.now()) x.setTime(Date.now() - 3600000);
      return x.toISOString();
    }

    var seeds = [
      {
        name: '王小美', phone: '13800138001', pin: '1234',
        txns: [
          { type: 'recharge', paidCents: 20000, payMethod: 'wechat', amountCents: 22000, item: '', operator: '小芳', role: 'staff', when: at(12, 11) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 6800, item: '染发', operator: '小芳', role: 'staff', when: at(10, 15) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 5200, item: '剪发', operator: '小丽', role: 'staff', when: at(3, 14) },
          { type: 'recharge', paidCents: 50000, payMethod: 'cash', amountCents: 58000, item: '', operator: '小芳', role: 'staff', when: at(2, 16) }
        ]
      },
      {
        name: '李婷婷', phone: '13800138002', pin: '1234',
        txns: [
          { type: 'recharge', paidCents: 10000, payMethod: 'alipay', amountCents: 10000, item: '', operator: '小丽', role: 'staff', when: at(8, 12) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 8800, item: '烫发', operator: '小丽', role: 'staff', when: at(5, 17) }
        ]
      },
      {
        name: '张雨晴', phone: '13800138003', pin: '1234',
        txns: [
          { type: 'recharge', paidCents: 100000, payMethod: 'wechat', amountCents: 120000, item: '', operator: '老板', role: 'boss', when: at(14, 10) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 12800, item: '护理', operator: '小芳', role: 'staff', when: at(0, 11) },
          { type: 'recharge', paidCents: 20000, payMethod: 'wechat', amountCents: 22000, item: '', operator: '小芳', role: 'staff', when: at(0, 13) }
        ]
      },
      {
        name: '陈静怡', phone: '13800138004', pin: '1234',
        txns: [
          { type: 'recharge', paidCents: 20000, payMethod: 'cash', amountCents: 22000, item: '', operator: '小芳', role: 'staff', when: at(6, 13) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 3600, item: '剪发', operator: '小丽', role: 'staff', when: at(0, 15) }
        ]
      },
      {
        name: '刘佳佳', phone: '13800138005', pin: '1234',
        txns: [
          { type: 'recharge', paidCents: 10000, payMethod: 'wechat', amountCents: 10000, item: '', operator: '小丽', role: 'staff', when: at(4, 12) },
          { type: 'consume', paidCents: null, payMethod: null, amountCents: 9900, item: '洗剪吹', operator: '小芳', role: 'staff', when: at(1, 16) }
        ]
      }
    ];

    var count = 0;
    seeds.forEach(function (s) {
      count += 1;
      var member = {
        id: nextId('member'),
        memberNo: 'M' + String(count).padStart(3, '0'),
        name: s.name,
        phone: s.phone,
        pin: s.pin,
        balanceCents: 0,
        note: '示例会员',
        createdAt: s.txns[0] ? s.txns[0].when : nowISO(),
        lastVisitAt: null
      };
      var balance = 0;
      var lastVisit = null;
      s.txns.forEach(function (t) {
        var before = balance;
        balance = t.type === 'recharge' ? balance + t.amountCents : balance - t.amountCents;
        lastVisit = t.when;
        d.transactions.push({
          id: nextId('txn'),
          memberId: member.id,
          type: t.type,
          paidCents: t.paidCents,
          payMethod: t.payMethod,
          amountCents: t.amountCents,
          balanceBeforeCents: before,
          balanceAfterCents: balance,
          operator: t.operator,
          operatorRole: t.role,
          item: t.item,
          reason: '',
          createdAt: t.when
        });
      });
      member.balanceCents = balance;
      member.lastVisitAt = lastVisit;
      d.members.push(member);
    });

    return { seeded: true, memberCount: count };
  }

  /* -------------------------------------------------------------- 初始化 */

  function boot() {
    var raw = readRaw();
    var parsed = null;
    if (raw) {
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    }
    db = normalize(parsed);
    var changed = false;

    if (!db.seeded) {
      // 首次运行：预置老板 PIN、恢复口令、示例会员与店员
      if (!db.settings.boss_pin) { db.settings.boss_pin = '8888'; changed = true; }
      if (!db.settings.boss_recovery_phrase) { db.settings.boss_recovery_phrase = '紫涵美发'; changed = true; }
      if (!db.members.length) { seedExamples(db); changed = true; }
      db.seeded = true;
      changed = true;
    }
    if (changed) persist();
  }

  function persist() {
    var text = JSON.stringify(db);
    if (!writeRaw(text)) {
      // 只在面板上提示，不打断 App 使用
      window.__zihanStorageWarn = true;
    }
  }

  /* ------------------------------------------------------------------ 工具 */

  function getSetting(key) {
    return Object.prototype.hasOwnProperty.call(db.settings, key) ? db.settings[key] : null;
  }
  function setSetting(key, value) {
    db.settings[key] = value;
  }
  function bossPin() {
    var v = getSetting('boss_pin');
    return v === null || v === undefined || v === '' ? null : String(v);
  }
  function bossRecovery() {
    var v = getSetting('boss_recovery_phrase');
    return v === null || v === undefined || v === '' ? null : String(v);
  }
  function loadPackages() {
    var raw = getSetting('packages');
    if (!raw) return DEFAULT_PACKAGES.slice();
    try {
      var list = JSON.parse(raw);
      var out = [];
      list.forEach(function (p) {
        if (Number.isInteger(p.paidCents) && p.paidCents > 0 && Number.isInteger(p.creditCents) && p.creditCents > 0) {
          out.push([p.paidCents, p.creditCents]);
        }
      });
      return out.length ? out : DEFAULT_PACKAGES.slice();
    } catch (e) {
      return DEFAULT_PACKAGES.slice();
    }
  }
  function packageCredit(paidCents) {
    var found = null;
    loadPackages().forEach(function (p) { if (p[0] === paidCents) found = p[1]; });
    return found;
  }
  function staffPinClash(pin, exceptId) {
    return db.staff.some(function (s) { return s.pin === pin && s.id !== exceptId; });
  }
  function findMember(id) {
    for (var i = 0; i < db.members.length; i++) if (db.members[i].id === id) return db.members[i];
    return null;
  }
  function findMemberByPhone(phone) {
    for (var i = 0; i < db.members.length; i++) if (db.members[i].phone === phone) return db.members[i];
    return null;
  }
  function computeTotals(txns) {
    var totals = {};
    txns.forEach(function (t) {
      var cur = totals[t.memberId] || { recharged: 0, consumed: 0 };
      if (t.type === 'recharge') cur.recharged += t.amountCents;
      if (t.type === 'consume') cur.consumed += t.amountCents;
      totals[t.memberId] = cur;
    });
    return totals;
  }
  function toMemberOut(m, totals, includePin) {
    var t = (totals && totals[m.id]) || { recharged: 0, consumed: 0 };
    return {
      id: m.id,
      memberNo: m.memberNo,
      name: m.name,
      phone: m.phone,
      pin: includePin ? m.pin : null,
      balanceCents: m.balanceCents,
      note: m.note,
      createdAt: m.createdAt,
      lastVisitAt: m.lastVisitAt || null,
      totalRechargedCents: t.recharged,
      totalConsumedCents: t.consumed
    };
  }
  function toTxnOut(t, memberMap) {
    var m = memberMap ? memberMap[t.memberId] : null;
    return {
      id: t.id,
      memberId: t.memberId,
      memberName: t.memberId === 0 ? '散客' : (m ? m.name : '（已佚）'),
      memberNo: t.memberId === 0 ? '' : (m ? m.memberNo : ''),
      type: t.type,
      paidCents: t.paidCents === undefined ? null : t.paidCents,
      payMethod: t.payMethod || null,
      amountCents: t.amountCents,
      balanceBeforeCents: t.balanceBeforeCents,
      balanceAfterCents: t.balanceAfterCents,
      operator: t.operator,
      operatorRole: t.operatorRole,
      item: t.item,
      reason: t.reason,
      createdAt: t.createdAt
    };
  }
  function toPendingOut(p, memberMap) {
    var m = memberMap ? memberMap[p.memberId] : null;
    return {
      id: p.id,
      memberId: p.memberId,
      memberName: m ? m.name : '（已佚）',
      memberNo: m ? m.memberNo : '',
      memberPhone: m ? m.phone : '',
      paidCents: p.paidCents,
      creditCents: p.creditCents,
      payMethod: p.payMethod,
      isCustom: !!p.isCustom,
      operator: p.operator,
      status: p.status,
      createdAt: p.createdAt
    };
  }
  function memberMap() {
    var map = {};
    db.members.forEach(function (m) { map[m.id] = m; });
    return map;
  }
  function txnsNewestFirst() {
    return db.transactions.slice().sort(function (a, b) { return ms(b.createdAt) - ms(a.createdAt) || b.id - a.id; });
  }
  function newMethodAcc() {
    return {
      wechat: { receivedCents: 0, count: 0 },
      cash: { receivedCents: 0, count: 0 },
      alipay: { receivedCents: 0, count: 0 }
    };
  }
  function addReceived(acc, method, cents) {
    var row = acc[method || 'wechat'];
    if (row) { row.receivedCents += cents; row.count += 1; }
  }
  function methodAccOut(acc) {
    return ['wechat', 'cash', 'alipay'].map(function (m) {
      return { method: m, receivedCents: acc[m].receivedCents, count: acc[m].count };
    });
  }

  function applyRecharge(member, paidCents, creditCents, payMethod, operator, role, itemNote) {
    var before = member.balanceCents;
    var after = before + creditCents;
    var now = nowISO();
    member.balanceCents = after;
    member.lastVisitAt = now;
    var txn = {
      id: nextId('txn'),
      memberId: member.id,
      type: 'recharge',
      paidCents: paidCents,
      payMethod: payMethod || 'wechat',
      amountCents: creditCents,
      balanceBeforeCents: before,
      balanceAfterCents: after,
      operator: operator,
      operatorRole: role,
      item: itemNote || '',
      reason: '',
      createdAt: now
    };
    db.transactions.push(txn);
    return txn;
  }

  /* ------------------------------------------------------------------ 动作 */

  var ACTIONS = {
    listMembers: function (args) {
      var totals = computeTotals(db.transactions);
      var includePin = args.role === 'boss';
      var out = db.members.map(function (m) { return toMemberOut(m, totals, includePin); });
      var q = String(args.query || '').trim();
      if (q) {
        out = out.filter(function (m) {
          return m.name.indexOf(q) >= 0 || m.phone.indexOf(q) >= 0 || m.memberNo.toLowerCase().indexOf(q.toLowerCase()) >= 0;
        });
      }
      if (args.sort === 'balanceDesc') out.sort(function (a, b) { return b.balanceCents - a.balanceCents; });
      else if (args.sort === 'balanceAsc') out.sort(function (a, b) { return a.balanceCents - b.balanceCents; });
      else out.sort(function (a, b) {
        var av = a.lastVisitAt || a.createdAt;
        var bv = b.lastVisitAt || b.createdAt;
        return bv < av ? -1 : bv > av ? 1 : 0;
      });
      return { members: out };
    },

    createMember: function (args) {
      var name = String(args.name || '').trim();
      var phone = String(args.phone || '').trim();
      var pin = String(args.pin || '').trim();
      var note = String(args.note || '').trim();
      if (!name || name.length > 30) return { ok: false, error: '姓名要填 1 到 30 个字', member: null };
      if (phone.length < 7 || phone.length > 15) return { ok: false, error: '手机号长度不对', member: null };
      if (!/^\d{4}$/.test(pin)) return { ok: false, error: 'PIN码要 4 位数字', member: null };
      if (findMemberByPhone(phone)) return { ok: false, error: '这个手机号已经注册过会员了', member: null };
      var n = db.members.length + 1;
      var memberNo = 'M' + String(n).padStart(3, '0');
      var taken = {};
      db.members.forEach(function (m) { taken[m.memberNo] = true; });
      while (taken[memberNo]) { n += 1; memberNo = 'M' + String(n).padStart(3, '0'); }
      var member = {
        id: nextId('member'),
        memberNo: memberNo,
        name: name,
        phone: phone,
        pin: pin,
        balanceCents: 0,
        note: note,
        createdAt: nowISO(),
        lastVisitAt: null
      };
      db.members.push(member);
      persist();
      return { ok: true, error: '', member: toMemberOut(member, {}, includePinFalse()) };
    },

    resetPin: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以重置PIN码' };
      var m = findMember(Number(args.memberId));
      if (!m) return { ok: false, error: '找不到这个会员' };
      if (!/^\d{4}$/.test(String(args.newPin || ''))) return { ok: false, error: 'PIN码要 4 位数字' };
      m.pin = String(args.newPin);
      persist();
      return { ok: true, error: '' };
    },

    recharge: function (args) {
      var m = findMember(Number(args.memberId));
      if (!m) return { ok: false, error: '找不到这个会员', status: 'error', transaction: null, pendingId: null };
      var paid = Math.round(Number(args.paidCents) || 0);
      var credit = Math.round(Number(args.creditCents) || 0);
      if (args.mode === 'package') {
        var pkg = packageCredit(paid);
        if (pkg === undefined || pkg === null) {
          return { ok: false, error: '请选择固定套餐', status: 'error', transaction: null, pendingId: null };
        }
        credit = pkg;
      } else if (args.role !== 'boss') {
        return { ok: false, error: '自定义金额只有雇主能用', status: 'error', transaction: null, pendingId: null };
      }
      if (!(paid > 0) || !(credit > 0)) {
        return { ok: false, error: '金额要大于 0', status: 'error', transaction: null, pendingId: null };
      }

      if (args.role === 'staff' && paid > APPROVAL_THRESHOLD_CENTS) {
        var p = {
          id: nextId('pending'),
          memberId: m.id,
          paidCents: paid,
          creditCents: credit,
          payMethod: args.payMethod || 'wechat',
          isCustom: args.mode === 'custom',
          operator: String(args.operator || ''),
          status: 'pending',
          createdAt: nowISO(),
          decidedBy: null,
          decidedAt: null
        };
        db.pending.push(p);
        persist();
        return { ok: true, error: '', status: 'pending', transaction: null, pendingId: p.id };
      }

      var txn = applyRecharge(m, paid, credit, args.payMethod, String(args.operator || ''), args.role === 'boss' ? 'boss' : 'staff', '');
      persist();
      var one = {};
      one[m.id] = m;
      return { ok: true, error: '', status: 'applied', transaction: toTxnOut(txn, one), pendingId: null };
    },

    consume: function (args) {
      var m = findMember(Number(args.memberId));
      if (!m) return { ok: false, error: '找不到这个会员', transaction: null };
      var amount = Math.round(Number(args.amountCents) || 0);
      if (!(amount > 0)) return { ok: false, error: '金额要大于 0', transaction: null };
      if (m.balanceCents < amount) return { ok: false, error: '余额不足，扣不了', transaction: null };
      var before = m.balanceCents;
      var after = before - amount;
      var now = nowISO();
      m.balanceCents = after;
      m.lastVisitAt = now;
      var txn = {
        id: nextId('txn'),
        memberId: m.id,
        type: 'consume',
        paidCents: null,
        payMethod: null,
        amountCents: amount,
        balanceBeforeCents: before,
        balanceAfterCents: after,
        operator: String(args.operator || ''),
        operatorRole: args.role === 'boss' ? 'boss' : 'staff',
        item: String(args.item || '').trim(),
        reason: '',
        createdAt: now
      };
      db.transactions.push(txn);
      persist();
      var one = {};
      one[m.id] = m;
      return { ok: true, error: '', transaction: toTxnOut(txn, one) };
    },

    adjustBalance: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以改账', transaction: null };
      var m = findMember(Number(args.memberId));
      if (!m) return { ok: false, error: '找不到这个会员', transaction: null };
      var target = Math.round(Number(args.newBalanceCents) || 0);
      if (target < 0) return { ok: false, error: '余额不能是负数', transaction: null };
      var delta = target - m.balanceCents;
      if (delta === 0) return { ok: false, error: '新余额和现在一样，不用改', transaction: null };
      var reason = String(args.reason || '').trim();
      if (!reason) return { ok: false, error: '请写一下改账原因', transaction: null };
      var before = m.balanceCents;
      m.balanceCents = target;
      var txn = {
        id: nextId('txn'),
        memberId: m.id,
        type: 'adjust',
        paidCents: null,
        payMethod: null,
        amountCents: delta,
        balanceBeforeCents: before,
        balanceAfterCents: target,
        operator: String(args.operator || ''),
        operatorRole: 'boss',
        item: '',
        reason: reason,
        createdAt: nowISO()
      };
      db.transactions.push(txn);
      persist();
      var one = {};
      one[m.id] = m;
      return { ok: true, error: '', transaction: toTxnOut(txn, one) };
    },

    listTransactions: function (args) {
      var limit = Math.min(Math.max(Number(args.limit) || 200, 1), 500);
      var map = memberMap();
      var all = txnsNewestFirst();
      if (args.memberId !== null && args.memberId !== undefined) {
        var mid = Number(args.memberId);
        all = all.filter(function (t) { return t.memberId === mid; });
      }
      return { transactions: all.slice(0, limit).map(function (t) { return toTxnOut(t, map); }) };
    },

    getStats: function (args) {
      function sumRange(start, end) {
        var acc = {
          received: 0, consumed: 0, rCount: 0, cCount: 0,
          walkinCents: 0, walkinCount: 0, byMethod: newMethodAcc()
        };
        db.transactions.forEach(function (t) {
          var at = ms(t.createdAt);
          if (at < start || at >= end) return;
          if (t.type === 'recharge') {
            var amt = t.paidCents === null || t.paidCents === undefined ? t.amountCents : t.paidCents;
            acc.received += amt;
            acc.rCount += 1;
            addReceived(acc.byMethod, t.payMethod, amt);
          } else if (t.type === 'consume' || t.type === 'walkin') {
            acc.consumed += t.amountCents;
            acc.cCount += 1;
            if (t.type === 'walkin') {
              acc.received += t.amountCents;
              acc.walkinCents += t.amountCents;
              acc.walkinCount += 1;
              addReceived(acc.byMethod, t.payMethod, t.amountCents);
            }
          }
        });
        return acc;
      }
      var day = sumRange(Number(args.dayStartMs), Number(args.dayEndMs));
      var month = sumRange(Number(args.monthStartMs), Number(args.monthEndMs));
      var sel = null;
      if (args.selectedDayStartMs !== null && args.selectedDayStartMs !== undefined &&
          args.selectedDayEndMs !== null && args.selectedDayEndMs !== undefined) {
        sel = sumRange(Number(args.selectedDayStartMs), Number(args.selectedDayEndMs));
      }
      var totalBalance = 0;
      db.members.forEach(function (m) { totalBalance += m.balanceCents; });
      return {
        dayReceivedCents: day.received,
        dayConsumedCents: day.consumed,
        dayRechargeCount: day.rCount,
        dayConsumeCount: day.cCount,
        dayWalkinCents: day.walkinCents,
        dayWalkinCount: day.walkinCount,
        monthReceivedCents: month.received,
        monthConsumedCents: month.consumed,
        monthRechargeCount: month.rCount,
        monthConsumeCount: month.cCount,
        monthWalkinCents: month.walkinCents,
        monthWalkinCount: month.walkinCount,
        selectedReceivedCents: sel ? sel.received : null,
        selectedConsumedCents: sel ? sel.consumed : null,
        selectedRechargeCount: sel ? sel.rCount : null,
        selectedConsumeCount: sel ? sel.cCount : null,
        selectedWalkinCents: sel ? sel.walkinCents : null,
        selectedWalkinCount: sel ? sel.walkinCount : null,
        dayByMethod: methodAccOut(day.byMethod),
        monthByMethod: methodAccOut(month.byMethod),
        selectedByMethod: sel ? methodAccOut(sel.byMethod) : null,
        totalMembers: db.members.length,
        totalBalanceCents: totalBalance,
        pendingCount: db.pending.filter(function (p) { return p.status === 'pending'; }).length
      };
    },

    getReport: function (args) {
      var starts = Array.isArray(args.bucketStartsMs) ? args.bucketStartsMs.map(Number) : [];
      var buckets = starts.map(function (s) {
        return { startMs: s, receivedCents: 0, consumedCents: 0, rechargeCount: 0, consumeCount: 0 };
      });
      var totalReceived = 0, totalConsumed = 0, rCount = 0, cCount = 0;
      var byMethod = newMethodAcc();
      var start = Number(args.startMs), end = Number(args.endMs);
      db.transactions.forEach(function (t) {
        var at = ms(t.createdAt);
        if (at < start || at >= end) return;
        var idx = -1;
        for (var i = starts.length - 1; i >= 0; i--) { if (at >= starts[i]) { idx = i; break; } }
        var bucket = idx >= 0 ? buckets[idx] : null;
        if (t.type === 'recharge') {
          var amt = t.paidCents === null || t.paidCents === undefined ? t.amountCents : t.paidCents;
          totalReceived += amt;
          rCount += 1;
          addReceived(byMethod, t.payMethod, amt);
          if (bucket) { bucket.receivedCents += amt; bucket.rechargeCount += 1; }
        } else if (t.type === 'consume' || t.type === 'walkin') {
          totalConsumed += t.amountCents;
          cCount += 1;
          if (t.type === 'walkin') addReceived(byMethod, t.payMethod, t.amountCents);
          if (bucket) { bucket.consumedCents += t.amountCents; bucket.consumeCount += 1; }
        }
      });
      return {
        totalReceivedCents: totalReceived,
        totalConsumedCents: totalConsumed,
        rechargeCount: rCount,
        consumeCount: cCount,
        netCents: totalReceived - totalConsumed,
        totalMembers: db.members.length,
        byMethod: methodAccOut(byMethod),
        buckets: buckets
      };
    },

    walkinConsume: function (args) {
      var amount = Math.round(Number(args.amountCents) || 0);
      var item = String(args.item || '').trim();
      if (!(amount > 0)) return { ok: false, error: '金额要大于 0', transaction: null };
      if (!item) return { ok: false, error: '请填服务项目', transaction: null };
      var txn = {
        id: nextId('txn'),
        memberId: 0,
        type: 'walkin',
        paidCents: amount,
        payMethod: args.payMethod || 'wechat',
        amountCents: amount,
        balanceBeforeCents: 0,
        balanceAfterCents: 0,
        operator: String(args.operator || ''),
        operatorRole: args.role === 'boss' ? 'boss' : 'staff',
        item: item,
        reason: '',
        createdAt: nowISO()
      };
      db.transactions.push(txn);
      persist();
      return { ok: true, error: '', transaction: toTxnOut(txn, {}) };
    },

    listPending: function () {
      var map = memberMap();
      var rows = db.pending.slice().sort(function (a, b) {
        var rank = function (s) { return s === 'pending' ? 0 : 1; };
        return rank(a.status) - rank(b.status) || a.id - b.id;
      });
      return { pending: rows.map(function (p) { return toPendingOut(p, map); }) };
    },

    decideApproval: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以审批', transaction: null };
      var p = null;
      db.pending.forEach(function (x) { if (x.id === Number(args.pendingId)) p = x; });
      if (!p) return { ok: false, error: '找不到这笔待审批记录', transaction: null };
      if (p.status !== 'pending') return { ok: false, error: '这笔记录已经处理过了', transaction: null };
      var now = nowISO();
      if (!args.approve) {
        p.status = 'rejected';
        p.decidedBy = String(args.operator || '');
        p.decidedAt = now;
        persist();
        return { ok: true, error: '', transaction: null };
      }
      var m = findMember(p.memberId);
      if (!m) return { ok: false, error: '找不到这个会员', transaction: null };
      p.status = 'approved';
      p.decidedBy = String(args.operator || '');
      p.decidedAt = now;
      var txn = applyRecharge(m, p.paidCents, p.creditCents, p.payMethod, p.operator, 'staff',
        '大额充值，经雇主 ' + String(args.operator || '') + ' 确认');
      persist();
      var one = {};
      one[m.id] = m;
      return { ok: true, error: '', transaction: toTxnOut(txn, one) };
    },

    customerLookup: function (args) {
      var m = findMemberByPhone(String(args.phone || '').trim());
      if (!m || m.pin !== String(args.pin || '').trim()) {
        return { ok: false, error: '手机号或PIN码不对，请核对后再试', member: null, transactions: [] };
      }
      var txns = db.transactions.filter(function (t) { return t.memberId === m.id; });
      var sorted = txns.slice().sort(function (a, b) { return ms(b.createdAt) - ms(a.createdAt) || b.id - a.id; });
      var totals = computeTotals(txns);
      var one = {};
      one[m.id] = m;
      return {
        ok: true,
        error: '',
        member: toMemberOut(m, totals),
        transactions: sorted.map(function (t) { return toTxnOut(t, one); })
      };
    },

    exportData: function () {
      var totals = computeTotals(db.transactions);
      var map = memberMap();
      return {
        exportedAt: nowISO(),
        members: db.members.map(function (m) {
          var out = toMemberOut(m, totals, true);
          out.pin = m.pin;
          return out;
        }),
        transactions: txnsNewestFirst().map(function (t) { return toTxnOut(t, map); }),
        pending: db.pending.slice().sort(function (a, b) { return a.id - b.id; }).map(function (p) { return toPendingOut(p, map); })
      };
    },

    getBossStatus: function () {
      return { hasBoss: bossPin() !== null, hasRecovery: bossRecovery() !== null };
    },

    setupBoss: function (args) {
      if (bossPin() !== null) return { ok: false, error: '雇主PIN码已经设置过了，直接登录就行' };
      var pin = String(args.pin || '');
      if (!/^\d{4,6}$/.test(pin)) return { ok: false, error: 'PIN码要 4 到 6 位数字' };
      if (staffPinClash(pin)) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      setSetting('boss_pin', pin);
      var phrase = String(args.recoveryPhrase || '').trim();
      if (phrase) setSetting('boss_recovery_phrase', phrase);
      persist();
      return { ok: true, error: '' };
    },

    changeBossPin: function (args) {
      var current = bossPin();
      if (current === null) return { ok: false, error: '还没设置雇主PIN码' };
      if (String(args.oldPin || '') !== current) return { ok: false, error: '旧PIN码不对，请核对后再试' };
      var next = String(args.newPin || '');
      if (!/^\d{4,6}$/.test(next)) return { ok: false, error: '新PIN码要 4 到 6 位数字' };
      if (next === current) return { ok: false, error: '新PIN码和旧的一样，换一个' };
      if (staffPinClash(next)) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      setSetting('boss_pin', next);
      persist();
      return { ok: true, error: '' };
    },

    setBossRecoveryPhrase: function (args) {
      var current = bossPin();
      if (current === null) return { ok: false, error: '还没设置雇主PIN码' };
      if (String(args.pin || '') !== current) return { ok: false, error: '雇主PIN码不对，请核对后再试' };
      var phrase = String(args.recoveryPhrase || '').trim();
      if (phrase.length < 4) return { ok: false, error: '恢复口令至少 4 个字' };
      setSetting('boss_recovery_phrase', phrase);
      persist();
      return { ok: true, error: '' };
    },

    resetBossPinWithRecovery: function (args) {
      var stored = bossRecovery();
      if (stored === null) {
        return { ok: false, error: '还没设置恢复口令，没法这样重置。请让记得PIN的人登录后在管理里设置恢复口令。' };
      }
      if (String(args.recoveryPhrase || '').trim() !== stored) {
        return { ok: false, error: '恢复口令不对，请核对后再试' };
      }
      var next = String(args.newPin || '');
      if (!/^\d{4,6}$/.test(next)) return { ok: false, error: '新PIN码要 4 到 6 位数字' };
      if (staffPinClash(next)) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      setSetting('boss_pin', next);
      persist();
      return { ok: true, error: '' };
    },

    changeStaffPin: function (args) {
      var oldPin = String(args.oldPin || '');
      var staff = null;
      db.staff.forEach(function (s) { if (s.pin === oldPin) staff = s; });
      if (!staff) return { ok: false, error: '旧PIN码不对，请核对后再试' };
      if (staff.name !== String(args.operator || '')) return { ok: false, error: '旧PIN码和当前登录的店员对不上' };
      var next = String(args.newPin || '');
      if (!/^\d{4,6}$/.test(next)) return { ok: false, error: '新PIN码要 4 到 6 位数字' };
      if (next === oldPin) return { ok: false, error: '新PIN码和旧的一样，换一个' };
      if (bossPin() !== null && next === bossPin()) return { ok: false, error: '这个PIN码和雇主的一样，换一个' };
      if (staffPinClash(next, staff.id)) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      staff.pin = next;
      persist();
      return { ok: true, error: '' };
    },

    customerChangePin: function (args) {
      var m = findMemberByPhone(String(args.phone || '').trim());
      if (!m || m.pin !== String(args.oldPin || '').trim()) {
        return { ok: false, error: '手机号或旧PIN码不对，请核对后再试' };
      }
      var next = String(args.newPin || '');
      if (!/^\d{4}$/.test(next)) return { ok: false, error: 'PIN码要 4 位数字' };
      if (next === m.pin) return { ok: false, error: '新PIN码和旧的一样，换一个' };
      m.pin = next;
      persist();
      return { ok: true, error: '' };
    },

    bossLogin: function (args) {
      var current = bossPin();
      if (current === null) return { ok: false, error: '还没设置雇主PIN码，先设置一下', name: '' };
      if (String(args.pin || '') !== current) return { ok: false, error: 'PIN码不对，请核对后再试', name: '' };
      return { ok: true, error: '', name: '老板' };
    },

    staffLogin: function (args) {
      var pin = String(args.pin || '');
      var staff = null;
      db.staff.forEach(function (s) { if (s.pin === pin) staff = s; });
      if (staff) return { ok: true, error: '', name: staff.name };
      if (bossPin() !== null && pin === bossPin()) return { ok: true, error: '', name: '老板' };
      return { ok: false, error: 'PIN码不对，请核对后再试', name: '' };
    },

    listStaff: function (args) {
      if (args.role !== 'boss') return { staff: [] };
      return {
        staff: db.staff.slice().sort(function (a, b) { return a.id - b.id; }).map(function (s) {
          return { id: s.id, name: s.name, pin: s.pin, createdAt: s.createdAt };
        })
      };
    },

    createStaff: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以加店员' };
      var name = String(args.name || '').trim();
      var pin = String(args.pin || '');
      if (!name || name.length > 20) return { ok: false, error: '店员名字要 1 到 20 个字' };
      if (!/^\d{4,6}$/.test(pin)) return { ok: false, error: 'PIN码要 4 到 6 位数字' };
      if (bossPin() !== null && pin === bossPin()) return { ok: false, error: '这个PIN码和雇主的一样，换一个' };
      if (staffPinClash(pin)) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      db.staff.push({ id: nextId('staff'), name: name, pin: pin, createdAt: nowISO() });
      persist();
      return { ok: true, error: '' };
    },

    resetStaffPin: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以改店员PIN码' };
      var next = String(args.newPin || '');
      if (!/^\d{4,6}$/.test(next)) return { ok: false, error: 'PIN码要 4 到 6 位数字' };
      if (bossPin() !== null && next === bossPin()) return { ok: false, error: '这个PIN码和雇主的一样，换一个' };
      if (staffPinClash(next, Number(args.staffId))) return { ok: false, error: '这个PIN码已经有店员在用了，换一个' };
      var target = null;
      db.staff.forEach(function (s) { if (s.id === Number(args.staffId)) target = s; });
      if (!target) return { ok: false, error: '找不到这个店员' };
      target.pin = next;
      persist();
      return { ok: true, error: '' };
    },

    deleteStaff: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以删店员' };
      db.staff = db.staff.filter(function (s) { return s.id !== Number(args.staffId); });
      persist();
      return { ok: true, error: '' };
    },

    getPackages: function () {
      var packages = loadPackages().map(function (p) { return { paidCents: p[0], creditCents: p[1] }; });
      packages.sort(function (a, b) { return a.paidCents - b.paidCents; });
      return { packages: packages };
    },

    updatePackages: function (args) {
      if (args.role !== 'boss') return { ok: false, error: '只有雇主可以改套餐' };
      var list = Array.isArray(args.packages) ? args.packages : [];
      if (list.length < 1 || list.length > 10) return { ok: false, error: '套餐要 1 到 10 个' };
      var seen = {};
      var clean = [];
      for (var i = 0; i < list.length; i++) {
        var paid = Number(list[i].paidCents);
        var credit = Number(list[i].creditCents);
        if (!(paid > 0) || !(credit > 0)) return { ok: false, error: '套餐金额要大于 0' };
        if (seen[paid]) return { ok: false, error: '套餐实收金额不能重复' };
        seen[paid] = true;
        clean.push({ paidCents: paid, creditCents: credit });
      }
      setSetting('packages', JSON.stringify(clean));
      persist();
      return { ok: true, error: '' };
    },

    seedExamples: function () {
      var res = seedExamples(db);
      db.seeded = true;
      persist();
      return res;
    }
  };

  function includePinFalse() { return false; }

  /* ------------------------------------------------------- 备份 / 恢复 / 清理 */

  function exportBackup() {
    return {
      app: 'zihan-salon-local',
      version: 1,
      exportedAt: nowISO(),
      bossPin: bossPin(),
      settings: db.settings,
      members: db.members,
      transactions: db.transactions,
      staff: db.staff,
      pending: db.pending,
      seq: db.seq
    };
  }

  function importBackup(data) {
    if (!data || typeof data !== 'object') throw new Error('文件内容不是备份数据');
    if (!Array.isArray(data.members) || !Array.isArray(data.transactions)) {
      throw new Error('备份文件缺少会员或流水数据');
    }
    var next = normalize({
      seeded: true,
      members: data.members,
      transactions: data.transactions,
      staff: data.staff,
      pending: data.pending,
      settings: data.settings,
      seq: data.seq
    });
    if (!next.settings.boss_pin && data.bossPin) next.settings.boss_pin = String(data.bossPin);
    if (!next.settings.boss_pin) next.settings.boss_pin = '8888';
    next.seeded = true;
    db = next;
    persist();
    return { members: db.members.length, transactions: db.transactions.length };
  }

  function clearDemo() {
    var ids = {};
    db.members.forEach(function (m) { if (m.note === '示例会员') ids[m.id] = true; });
    if (!Object.keys(ids).length) return 0;
    db.members = db.members.filter(function (m) { return !ids[m.id]; });
    db.transactions = db.transactions.filter(function (t) { return !ids[t.memberId]; });
    db.pending = db.pending.filter(function (p) { return !ids[p.memberId]; });
    db.staff = db.staff.filter(function (s) { return s.name !== '小芳' && s.name !== '小丽'; });
    persist();
    return Object.keys(ids).length;
  }

  function resetAll() {
    db = emptyDB();
    db.seeded = true;
    db.settings.boss_pin = '8888';
    db.settings.boss_recovery_phrase = '紫涵美发';
    persist();
  }

  function stats() {
    var balance = 0;
    db.members.forEach(function (m) { balance += m.balanceCents; });
    var bytes = 0;
    try { bytes = (JSON.stringify(db) || '').length * 2; } catch (e) { bytes = 0; }
    return {
      members: db.members.length,
      transactions: db.transactions.length,
      balanceCents: balance,
      pending: db.pending.filter(function (p) { return p.status === 'pending'; }).length,
      demoMembers: db.members.filter(function (m) { return m.note === '示例会员'; }).length,
      staff: db.staff.map(function (s) { return { name: s.name, pin: s.pin }; }),
      bossPin: bossPin(),
      recovery: bossRecovery(),
      bytes: bytes,
      storageOK: storageOK && !window.__zihanStorageWarn
    };
  }

  /* ----------------------------------------------------------- fetch 拦截 */

  function isActionsUrl(url) {
    if (!url) return false;
    var clean = String(url).split('?')[0].split('#')[0];
    return /(^|\/)actions$/.test(clean);
  }

  function jsonResponse(payload, status) {
    var body = JSON.stringify(payload);
    if (typeof Response === 'function') {
      try {
        return new Response(body, {
          status: status || 200,
          headers: { 'content-type': 'application/json' }
        });
      } catch (e) { /* 老浏览器不支持 Response 构造 */ }
    }
    return {
      ok: (status || 200) < 400,
      status: status || 200,
      headers: { get: function () { return 'application/json'; } },
      json: function () { return Promise.resolve(payload); },
      text: function () { return Promise.resolve(body); }
    };
  }

  var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;

  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (!isActionsUrl(url)) {
      if (nativeFetch) {
        try { return nativeFetch(input, init); } catch (e) { return Promise.reject(e); }
      }
      return Promise.reject(new TypeError('fetch failed'));
    }
    var body = init && init.body;
    var req = {};
    try {
      req = typeof body === 'string' ? JSON.parse(body) : (body || {});
    } catch (e) {
      req = {};
    }
    var action = req.action;
    var args = req.args || {};
    var fn = ACTIONS[action];
    if (!fn) {
      console.error('[zihan-local] 未知动作：' + action);
      return Promise.resolve(jsonResponse({ error: { code: 'UNKNOWN_ACTION', message: '未知动作 ' + action } }, 400));
    }
    var result;
    try {
      result = fn(args);
    } catch (err) {
      console.error('[zihan-local] 动作 ' + action + ' 出错', err);
      return Promise.resolve(jsonResponse({ error: { code: 'INTERNAL', message: String(err && err.message || err) } }, 500));
    }
    return Promise.resolve(jsonResponse({ data: result }));
  };

  /* ------------------------------------------------------------- 对外接口 */

  boot();

  window.__zihanLocal = {
    actions: ACTIONS,
    dispatch: function (action, args) {
      var fn = ACTIONS[action];
      return fn ? fn(args || {}) : { error: '未知动作 ' + action };
    },
    exportBackup: exportBackup,
    importBackup: importBackup,
    clearDemo: clearDemo,
    resetAll: resetAll,
    stats: stats,
    raw: function () { return db; }
  };
})();

</script>
<script>
/* =============================================================================
   本地数据面板：导出 / 恢复 JSON 备份、清除示例数据、清空本机数据
   原版 App 头部已有「导出备份」；这里补上原版没有的「恢复」入口，
   以及纯本地运行时需要的兜底操作。完全独立于 React，不触碰 App 的 DOM。
   ========================================================================== */
(function () {
  'use strict';
  var L = window.__zihanLocal;
  if (!L) return;

  var open = false;
  var root = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function yuan(cents) {
    var v = (cents || 0) / 100;
    return '¥' + v.toLocaleString('zh-CN', {
      minimumFractionDigits: Number.isInteger(v) ? 0 : 2,
      maximumFractionDigits: 2
    });
  }
  function sizeLabel(bytes) {
    if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    if (bytes > 1024) return Math.round(bytes / 1024) + ' KB';
    return bytes + ' B';
  }
  function stamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
  }

  /* ------------------------------------------------------------------ 样式 */
  var css = [
    '#zh-local-launch{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;',
    'display:inline-flex;align-items:center;gap:6px;border:1px solid #e6ddf2;background:rgba(255,255,255,.92);',
    'color:#7d6eab;border-radius:999px;padding:7px 12px 7px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;',
    'box-shadow:0 4px 16px rgba(74,66,88,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);',
    'font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;min-height:36px}',
    '#zh-local-launch:active{transform:scale(.97)}',
    '#zh-local-mask{position:fixed;inset:0;z-index:70;background:rgba(40,34,52,.42);display:flex;align-items:flex-end;',
    'justify-content:center;padding:0;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}',
    '@media (min-width:640px){#zh-local-mask{align-items:center;padding:24px}}',
    '#zh-local-sheet{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;',
    'padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(40,34,52,.18);',
    'font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:#4a4258}',
    '@media (min-width:640px){#zh-local-sheet{border-radius:20px;padding-bottom:20px}}',
    '.zh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}',
    '.zh-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.02em}',
    '.zh-x{border:0;background:#f4f0fb;color:#8d84a3;width:32px;height:32px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer}',
    '.zh-sub{margin:2px 0 14px;font-size:12.5px;line-height:1.6;color:#8d84a3}',
    '.zh-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}',
    '.zh-stat{background:#faf7ff;border:1px solid #efe8fa;border-radius:12px;padding:9px 11px}',
    '.zh-stat small{display:block;font-size:11px;color:#9b93ad;letter-spacing:.03em}',
    '.zh-stat b{display:block;margin-top:3px;font-size:16px;font-weight:800;color:#4a4258;font-variant-numeric:tabular-nums}',
    '.zh-sec{border-top:1px solid #f1ebf9;padding-top:14px;margin-top:4px}',
    '.zh-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}',
    '.zh-sec h3{margin:0 0 6px;font-size:13px;font-weight:800;color:#4a4258}',
    '.zh-sec p{margin:0 0 10px;font-size:12px;line-height:1.6;color:#8d84a3}',
    '.zh-btns{display:flex;flex-wrap:wrap;gap:8px}',
    '.zh-btn{border:1px solid #e6ddf2;background:#fff;color:#4a4258;border-radius:11px;padding:10px 14px;font-size:13px;',
    'font-weight:700;cursor:pointer;font-family:inherit;min-height:40px}',
    '.zh-btn.pri{background:#7d6eab;border-color:#7d6eab;color:#fff}',
    '.zh-btn.warn{border-color:#f0d3d3;color:#b0413f}',
    '.zh-btn:disabled{opacity:.42;cursor:not-allowed}',
    '.zh-tips{background:#faf7ff;border:1px dashed #ddd0f0;border-radius:12px;padding:10px 12px;font-size:12px;',
    'line-height:1.75;color:#6c6383;margin-top:10px}',
    '.zh-tips b{color:#4a4258;font-variant-numeric:tabular-nums}',
    '.zh-warn{background:#fdf3f3;border:1px solid #f2d7d7;color:#a03f3d;border-radius:12px;padding:9px 12px;',
    'font-size:12px;line-height:1.6;margin-bottom:12px}',
    '.zh-ok{background:#f0f8f3;border:1px solid #d5e9de;color:#2f7d55;border-radius:12px;padding:9px 12px;',
    'font-size:12px;line-height:1.6;margin-bottom:12px}',
    '.zh-hide{display:none !important}'
  ].join('');

  function styleOnce() {
    if (document.getElementById('zh-local-style')) return;
    var s = document.createElement('style');
    s.id = 'zh-local-style';
    s.textContent = css;
    document.head.appendChild(s);
  }

  /* -------------------------------------------------------------- 面板内容 */
  // 原版把当前身份存在这个键里（App.tsx 的 IDENTITY_KEY）
  function identityRole() {
    try {
      var raw = window.localStorage.getItem('member-recharge-identity-v2');
      if (!raw) return null;
      var id = JSON.parse(raw);
      return id && (id.role === 'boss' || id.role === 'staff') ? id.role : null;
    } catch (e) { return null; }
  }

  function customerVisible() {
    // 顾客自助页（未登录也能进）上不显示任何 PIN
    if (document.querySelector('#cust-phone, #cust-pin')) return true;
    var root = document.querySelector('[data-generated-space-root]');
    if (!root) return false;
    var clone = root.cloneNode(true);
    var junk = clone.querySelectorAll('script,style');
    for (var i = 0; i < junk.length; i++) junk[i].parentNode.removeChild(junk[i]);
    return clone.textContent.indexOf('查我的余额') >= 0;
  }

  function sheetHTML() {
    var st = L.stats();
    var demo = st.demoMembers;
    // PIN 只在「老板已登录」或「首次试用且不在顾客页」时显示
    var showPins = identityRole() === 'boss' || (demo > 0 && st.bossPin === '8888' && !customerVisible());
    var warn = '';
    if (!st.storageOK) {
      warn = '<div class="zh-warn">这个浏览器不允许本地存储（可能是无痕模式）。现在录入的会员和流水关掉页面就会丢，请换普通窗口打开，或先导出备份。</div>';
    }
    return '' +
      '<div class="zh-h"><h2>本地数据</h2><button class="zh-x" type="button" data-zh="close" aria-label="关闭">×</button></div>' +
      '<p class="zh-sub">所有会员、流水、审批都只存在这台设备的浏览器里，不联网、不上传。清理浏览器数据或换手机会丢，记得定期导出备份。</p>' +
      warn +
      '<div class="zh-stats">' +
        '<div class="zh-stat"><small>会员</small><b>' + st.members + ' 位</b></div>' +
        '<div class="zh-stat"><small>流水</small><b>' + st.transactions + ' 条</b></div>' +
        '<div class="zh-stat"><small>卡内沉淀</small><b>' + yuan(st.balanceCents) + '</b></div>' +
        '<div class="zh-stat"><small>待审批</small><b>' + st.pending + ' 笔</b></div>' +
      '</div>' +

      '<div class="zh-sec">' +
        '<h3>备份与恢复</h3>' +
        '<p>导出后存到网盘或微信收藏。换手机、清理浏览器数据后，用它一次性恢复全部会员与流水。</p>' +
        '<div class="zh-btns">' +
          '<button class="zh-btn pri" type="button" data-zh="export">导出 JSON 备份</button>' +
          '<button class="zh-btn" type="button" data-zh="import">恢复 JSON 备份</button>' +
        '</div>' +
      '</div>' +

      (showPins
        ? '<div class="zh-sec" style="margin-top:14px">' +
            '<h3>测试入口（别让顾客看到）</h3>' +
            '<div class="zh-tips">' +
              '雇主 PIN：<b>' + esc(st.bossPin || '未设置') + '</b>（恢复口令 <b>' + esc(st.recovery || '未设置') + '</b>）<br>' +
              '店员 PIN：' + (st.staff.length ? st.staff.map(function (s) { return '<b>' + esc(s.pin) + '</b>（' + esc(s.name) + '）'; }).join('、') : '未建店员') + '<br>' +
              '顾客查询：手机号 13800138001～13800138005，PIN <b>1234</b>' +
            '</div>' +
          '</div>'
        : '') +

      '<div class="zh-sec" style="margin-top:14px">' +
        '<h3>示例数据</h3>' +
        '<p>' + (demo ? '现在还有 ' + demo + ' 位示例会员（王小美等）和示例店员（小芳、小丽），正式用之前建议清掉。' : '示例数据已清理干净。') + '</p>' +
        '<div class="zh-btns">' +
          '<button class="zh-btn" type="button" data-zh="demo" ' + (demo ? '' : 'disabled') + '>清除示例会员与流水</button>' +
        '</div>' +
      '</div>' +

      '<div class="zh-sec" style="margin-top:14px">' +
        '<p style="margin-bottom:8px">本机占用 ' + sizeLabel(st.bytes) + ' · ' + (st.storageOK ? '存储正常' : '存储异常') + '</p>' +
        '<div class="zh-btns">' +
          '<button class="zh-btn warn" type="button" data-zh="reset">清空全部数据</button>' +
        '</div>' +
      '</div>';
  }

  function render() {
    if (!root) return;
    root.querySelector('#zh-local-sheet').innerHTML = sheetHTML();
  }

  function close() {
    if (!root) return;
    root.remove();
    root = null;
    open = false;
    document.documentElement.style.overflow = '';
  }

  function openPanel() {
    styleOnce();
    if (open) return;
    open = true;
    root = document.createElement('div');
    root.id = 'zh-local-mask';
    root.innerHTML = '<div id="zh-local-sheet" role="dialog" aria-modal="true" aria-label="本地数据"></div>';
    document.body.appendChild(root);
    render();
    document.documentElement.style.overflow = 'hidden';
    var mask = root;
    mask.addEventListener('click', function (e) {
      if (e.target === mask) close();
    });
    mask.addEventListener('click', function (e) {
      var t = e.target.closest('[data-zh]');
      if (!t) return;
      var act = t.getAttribute('data-zh');
      if (act === 'close') { close(); return; }
      if (act === 'export') { doExport(); return; }
      if (act === 'import') { pickImport(); return; }
      if (act === 'demo') { doClearDemo(); return; }
      if (act === 'reset') { doReset(); return; }
    });
  }

  /* ---------------------------------------------------------------- 动作 */

  function flash(msg, tone) {
    var sheet = root && root.querySelector('#zh-local-sheet');
    if (!sheet) return;
    var old = sheet.querySelector('.zh-ok, .zh-warn');
    if (old && old.dataset.flash) old.remove();
    var box = document.createElement('div');
    box.className = tone === 'bad' ? 'zh-warn' : 'zh-ok';
    box.dataset.flash = '1';
    box.textContent = msg;
    var h = sheet.querySelector('.zh-h');
    if (h && h.parentNode) h.parentNode.insertBefore(box, h.nextSibling.nextSibling);
    setTimeout(function () { if (box.parentNode) box.remove(); }, 3200);
  }

  function doExport() {
    try {
      var data = L.exportBackup();
      download('紫涵会员备份-' + stamp() + '.json', JSON.stringify(data, null, 2), 'application/json');
      flash('备份已导出，收到「下载」里，建议再存一份到网盘。', 'ok');
    } catch (e) {
      flash('导出失败：' + (e && e.message ? e.message : e), 'bad');
    }
  }

  function pickImport() {
    var input = document.getElementById('zh-local-file');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.id = 'zh-local-file';
      input.style.display = 'none';
      input.addEventListener('change', onImportFile);
      document.body.appendChild(input);
    }
    input.value = '';
    input.click();
  }

  function onImportFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        flash('这不是有效的备份文件（JSON 解析失败）。', 'bad');
        return;
      }
      if (!data || !Array.isArray(data.members) || !Array.isArray(data.transactions)) {
        flash('备份文件格式不对，缺少会员或流水。', 'bad');
        return;
      }
      var st = L.stats();
      var ok = window.confirm(
        '用这份备份覆盖本机数据？\n\n' +
        '备份包含 ' + data.members.length + ' 位会员、' + data.transactions.length + ' 条流水。\n' +
        '本机现有 ' + st.members + ' 位会员、' + st.transactions + ' 条流水，会被全部替换。\n\n' +
        '建议先点「导出 JSON 备份」把现在的存一份。'
      );
      if (!ok) return;
      try {
        var res = L.importBackup(data);
        window.alert('恢复完成：' + res.members + ' 位会员、' + res.transactions + ' 条流水。页面会重新加载。');
        window.location.reload();
      } catch (err2) {
        flash('恢复失败：' + (err2 && err2.message ? err2.message : err2), 'bad');
      }
    };
    reader.onerror = function () { flash('读取文件失败，请重试。', 'bad'); };
    reader.readAsText(file, 'utf-8');
  }

  function doClearDemo() {
    var n = L.stats().demoMembers;
    if (!n) { flash('没有示例会员了。', 'ok'); return; }
    if (!window.confirm('清除 ' + n + ' 位示例会员（王小美等）、他们的示例流水，以及示例店员（小芳、小丽）？\n真实会员和真实店员不受影响。')) return;
    L.clearDemo();
    render();
    flash('示例数据已清除，可以开始录真实会员了。', 'ok');
    setTimeout(function () { window.location.reload(); }, 900);
  }

  function doReset() {
    if (!window.confirm('清空这台设备上的全部会员、流水和审批？\n\n清空后只能用备份文件找回，确定继续？')) return;
    if (!window.confirm('最后确认：真的要清空吗？')) return;
    L.resetAll();
    window.location.reload();
  }

  /* ---------------------------------------------------------------- 启动 */

  function mount() {
    styleOnce();
    if (document.getElementById('zh-local-launch')) return;
    var btn = document.createElement('button');
    btn.id = 'zh-local-launch';
    btn.type = 'button';
    btn.setAttribute('aria-label', '本地数据与备份');
    btn.innerHTML =
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>' +
      '<path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>' +
      '<span>本地数据</span>';
    btn.addEventListener('click', openPanel);
    document.body.appendChild(btn);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && open) close();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();

</script>
